        crossorigin="anonymous"
    >

</head>

<body>

        <div class="container">

                <a
                    href="/"
                    class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none"
                >
                    <svg
                        class="bi me-2"
                        width="40"
                        height="32"
                        role="img"
                        aria-label="Bootstrap"
                    >
                        <use xlink:href="#bootstrap"></use>
                    </svg>
                </a>

                <ul
                    class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0"
                >
                    <li>
                        <a href="index.html" class="nav-link px-2 text-white">

                    <li>
                        <a href="study.html" class="nav-link px-2 text-white">

  <!-- MAIN CONTENT -->
    <div class="container" id="flashcards">
      <div id="carouselExample" class="carousel slide">
        <!-- INDICATORS -->
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide-to="0"
            class="active"
            aria-current="true"
            aria-label="Flashcard 1"
          ></button>

          <button
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide-to="1"
            aria-label="Flashcard 2"
          ></button>

          <button
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide-to="2"
            aria-label="Flashcard 3"
          ></button>

          <button
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide-to="3"
            aria-label="Flashcard 4"
          ></button>

          <button
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide-to="4"
            aria-label="Flashcard 5"
          ></button>

          <button
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide-to="5"
            aria-label="Flashcard 6"
          ></button>

          <button
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide-to="6"
            aria-label="Flashcard 7"
          ></button>
          
          <button
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide-to="7"
            aria-label="Flashcard 8"
          ></button>

          <button
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide-to="8"
            aria-label="Flashcard 9"
          ></button>

          <button
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide-to="9"
            aria-label="Flashcard 10"
          ></button>
        </div>
        <div class="carousel-inner">
          <!-- FLASHCARD 1 -->
          <div class="carousel-item active">
            <input type="checkbox" id="card1" class="flip-checkbox" />

            <label for="card1" class="flashcard-container">
              <div class="flashcard">
                <!-- FRONT OF CARD -->
                <div class="face">
                  <h3>
                   How long should you scrub your hands with soap?
                  </h3>

                  <p>Tap to reveal answer!</p>
                </div>

                <!-- BACK OF CARD -->
                <div class="face back">
                  <h3>At least 20 seconds</h3>
                </div>
              </div>
            </label>
          </div>

          <!-- FLASHCARD 2 -->
          <div class="carousel-item">
            <input type="checkbox" id="card2" class="flip-checkbox" />

            <label for="card2" class="flashcard-container">
              <div class="flashcard">
                <!-- FRONT OF CARD -->
                <div class="face">
                  <h3>
                    When should you wash your hands if you are experiencing sickness?
                  </h3>

                  <p>Tap to reveal answer!</p>
                </div>

                <!-- BACK OF CARD -->
                <div class="face back">
                  <h3>After coughing, sneezing, or blowing your nose</h3>
                </div>
              </div>
            </label>
          </div>

        <!-- FLASHCARD 3 -->
          <div class="carousel-item">
            <input type="checkbox" id="card3" class="flip-checkbox" />

            <label for="card3" class="flashcard-container">
              <div class="flashcard">
                <!-- FRONT OF CARD -->
                <div class="face">
                  <h3>
                    Which actions are part of proper handwashing?
                  </h3>

                  <p>Tap to reveal answer!</p>
                </div>

                <!-- BACK OF CARD -->
                <div class="face back">
                  <h3>Wet, lather with soap, scrub, rinse, and dry hands</h3>
                </div>
              </div>
            </label>
          </div>

        <!-- FLASHCARD 4 -->
          <div class="carousel-item">
            <input type="checkbox" id="card4" class="flip-checkbox" />

            <label for="card4" class="flashcard-container">
              <div class="flashcard">
                <!-- FRONT OF CARD -->
                <div class="face">
                  <h3>
                    True or False: An alcohol-based hand sanitizer can be used when soap and water are not available.
                  </h3>

                  <p>Tap to reveal answer!</p>
                </div>

                <!-- BACK OF CARD -->
                <div class="face back">
                  <h3>True</h3>
                </div>
              </div>
            </label>
          </div>

          <!-- FLASHCARD 5 -->
          <div class="carousel-item">
            <input type="checkbox" id="card5" class="flip-checkbox" />

            <label for="card5" class="flashcard-container">
              <div class="flashcard">
                <!-- FRONT OF CARD -->
                <div class="face">
                  <h3>
                    Why is regular bathing or showering important?
                  </h3>

                  <p>Tap to reveal answer!</p>
                </div>

                <!-- BACK OF CARD -->
                <div class="face back">
                  <h3>It removes sweat, dirt, oil, and germs from the skin.</h3>
                </div>
              </div>
            </label>
          </div>
          <!-- FLASHCARD 6 -->
          <div class="carousel-item">
            <input type="checkbox" id="card6" class="flip-checkbox" />

            <label for="card6" class="flashcard-container">
              <div class="flashcard">
                <!-- FRONT OF CARD -->
                <div class="face">
                  <h3>
                    Which body areas deserve special attention during bathing because sweat often collects there?
                  </h3>

                  <p>Tap to reveal answer!</p>
                </div>

                <!-- BACK OF CARD -->
                <div class="face back">
                  <h3>Underarms, feet, and groin area</h3>
                </div>
              </div>
            </label>
          </div>
          <!-- FLASHCARD 7 -->
          <div class="carousel-item">
            <input type="checkbox" id="card7" class="flip-checkbox" />

            <label for="card7" class="flashcard-container">
              <div class="flashcard">
                <!-- FRONT OF CARD -->
                <div class="face">
                  <h3>
                    You should never dry yourself thoroughly after bathing.
                  </h3>

                  <p>Tap to reveal answer!</p>
                </div>

                <!-- BACK OF CARD -->
                <div class="face back">
                  <h3>False</h3>
                </div>
              </div>
            </label>
          </div>
          <!-- FLASHCARD 8 -->
          <div class="carousel-item">
            <input type="checkbox" id="card8" class="flip-checkbox" />

            <label for="card8" class="flashcard-container">
              <div class="flashcard">
                <!-- FRONT OF CARD -->
                <div class="face">
                  <h3>
                    What should you do after bathing?
                  </h3>

                  <p>Tap to reveal answer!</p>
                </div>

                <!-- BACK OF CARD -->
                <div class="face back">
                  <h3>Change into clean underwear and clothes.</h3>
                </div>
              </div>
            </label>
          </div>
          <!-- FLASHCARD 9 -->
          <div class="carousel-item">
            <input type="checkbox" id="card9" class="flip-checkbox" />

            <label for="card9" class="flashcard-container">
              <div class="flashcard">
                <!-- FRONT OF CARD -->
                <div class="face">
                  <h3>
                    When might you need to shower more often than usual?
                  </h3>

                  <p>Tap to reveal answer!</p>
                </div>

                <!-- BACK OF CARD -->
                <div class="face back">
                  <h3>After exercise or sports</h3>
                </div>
              </div>
            </label>
          </div>
          <!-- FLASHCARD 10 -->
          <div class="carousel-item">
            <input type="checkbox" id="card10" class="flip-checkbox" />

            <label for="card10" class="flashcard-container">
              <div class="flashcard">
                <!-- FRONT OF CARD -->
                <div class="face">
                  <h3>
                    How often should you wash your hair?
                  </h3>

                  <p>Tap to reveal answer!</p>
                </div>

                <!-- BACK OF CARD -->
                <div class="face back">
                  <h3>Based on your hair type and activity level</h3>
                </div>
              </div>
            </label>
          </div>
        </div>
        <!-- PREVIOUS BUTTON -->
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExample"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>

          <span class="visually-hidden"> Previous </span>
        </button>

        <!-- NEXT BUTTON -->
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExample"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>

          <span class="visually-hidden"> Next </span>
        </button>
      </div>
    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"
    ></script>
</body>
